{% extends "base.html" %}
{% block title %}{{ code }} - {{ site_name }}{% endblock %}
{% block content %}
<div class="card" style="max-width:560px;margin:48px auto;text-align:center;">
  <p class="mono" style="font-size:44px;margin:16px 0 4px;">{{ code }}</p>
  <p>{{ message }}</p>
  <p style="margin-top:20px;">
    {% if session.get('uid') %}
    <a class="btn btn-primary" href="{{ url_for('main.index') }}">Back to dashboard</a>
    {% else %}
    <a class="btn btn-primary" href="{{ url_for('auth.login') }}">Go to sign in</a>
    {% endif %}
  </p>
</div>
{% endblock %}
